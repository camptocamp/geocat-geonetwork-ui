<gn-ui-autocomplete
  [placeholder]="'search.field.location.placeholder' | translate"
  [displayWithFn]="displayWithFn"
  [action]="autoCompleteAction"
  (itemSelected)="handleItemSelection($event)"
  (inputSubmitted)="handleInputSubmission($event)"
  icon="matPinDropOutline"
  [value]="currentLocation$ | async"
  [minCharacterCount]="1"
  [allowSubmit]="true"
></gn-ui-autocomplete>
